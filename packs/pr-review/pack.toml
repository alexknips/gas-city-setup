# pr-review: Gas City reviews a firehose of PRs for a human and surfaces only what needs them (README.md).
# orders/pr-review-sweep.toml: every 30 min, zero-token rules on each new PR head (open, or merged since
# the last sweep), one bead per PR in its rig, and a review queue. No model, nothing posted.
# orders/pr-review-run.toml: every 15 min, CI escalations (no model), then the next queued PR within a daily
# cap, reviewed by one headless read-only model run built on Claude Code's /security-review plus a
# checklist. The script posts a PENDING review (shadow, the default) or the review (live) and puts the
# outcome word and the link in Slack. Both orders ship off (PR_REVIEW = "off"); a city turns them on with
# an override that names its repos, reviewer and channel. No agents, no formulas.
[pack]
name = "pr-review"
schema = 2
