# Token prices for "cost per landed bead", in USD per million tokens (MTok).
# Source: https://platform.claude.com/docs/en/about-claude/pricing, read 2026-10-26 (Claude API,
# first party). These are list prices: a city on a subscription pays a flat fee instead, so the
# page shows tokens next to dollars.
#
# A city overrides or extends this table with its own file in the same shape, named by
# QUALITY_PRICES: each [models."<id>"] there replaces the entry here as a whole, and each key of
# [modifiers] replaces the one here.
#
# A message is priced by the exact model id its transcript records (a trailing -YYYYMMDD date is
# dropped first). There is no prefix matching: "claude-opus-5" does not price "claude-opus-5-5".
# A model, speed or service tier without an entry is shown as unpriced tokens, never as $0.
#
# Rates per entry: input, cache_write_5m, cache_write_1h, cache_read, output.
#   fast          rates when the transcript says usage.speed = "fast" (caching multipliers are
#                 already applied in the numbers below)
#   long_context  rates for a request whose prompt (input + cache reads + cache writes) is over
#                 `above` tokens

[modifiers]
# usage.inference_geo: US-only inference costs 1.1x on Claude 4.6 and later; global is the default.
# "not_available" is what the API reported before it reported a geo (in the city this was built in,
# every message until 2026-10-09, then "global" from the same sessions): read as the default.
# A message whose geo is not listed here is unpriced.
inference_geo = { global = 1.0, not_available = 1.0, us = 1.1 }
# usage.server_tool_use.web_search_requests: $10 per 1,000 searches, on top of tokens.
web_search_request = 0.01
# usage.service_tier values priced at these rates; any other tier is unpriced.
service_tiers = ["standard"]

